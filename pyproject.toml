[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photo-process"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "U.N. Owen", email = "void@some.where" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "pydantic",
  "ipykernel",
  "exifread",
  "click",
  "loguru",
]

[project.scripts]
photo-cli = "photo_process.cli:organize"

[project.urls]
Documentation = "https://github.com/U.N. Owen/photo-process#readme"
Issues = "https://github.com/U.N. Owen/photo-process/issues"
Source = "https://github.com/U.N. Owen/photo-process"

[tool.hatch.version]
path = "src/photo_process/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/photo_process tests}"

[tool.coverage.run]
source_pkgs = ["photo_process", "tests"]
branch = true
parallel = true
omit = [
  "src/photo_process/__about__.py",
]

[tool.coverage.paths]
photo_process = ["src/photo_process", "*/photo-process/src/photo_process"]
tests = ["tests", "*/photo-process/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
